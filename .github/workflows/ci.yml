name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: uv sync --locked
      - name: Cache WPILib and JUnit jars
        uses: actions/cache@v4
        with:
          path: ~/.cad2ascope-m2
          key: java-deps-${{ hashFiles('scripts/fetch-java-deps.py') }}
      - name: Fetch WPILib and JUnit jars
        run: uv run python scripts/fetch-java-deps.py ~/.cad2ascope-m2
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (generated Java is compiled and its JUnit tests run)
        run: WPILIB_MAVEN=~/.cad2ascope-m2 CAD2ASCOPE_REQUIRE_JAVA=1 uv run pytest
