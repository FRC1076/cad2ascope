[project]
name = "cad2ascope"
version = "0.0.1"
description = "Turn an Onshape robot assembly into an articulated AdvantageScope robot asset and generated WPILib Java."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Pioneer Robotics: PiHi Samurai, FRC Team 1076" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "trimesh>=4.5",
    "fast-simplification>=0.1.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "requests>=2.32",
    "jinja2>=3.1",
]

[project.scripts]
cad2ascope = "cad2ascope.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad2ascope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # ruff format handles line length; long user-facing strings stay on one line
