# cad/advantagescope.yaml: example team config for cad2ascope.
# Lives in each ROBOT repo, not in the public cad2ascope repo.
# Validated against advantagescope.schema.json.

robot:
  name: "1076 2027"                 # shown in AdvantageScope's robot list; must be unique
  folder: Robot_1076_2027           # output folder under assets/advantagescope/
  onshape_url: https://aaps.onshape.com/documents/000000000000000000000000/w/000000000000000000000000/e/000000000000000000000000   # placeholder: paste your assembly URL
  configuration: "Export=AdvantageScope"
  version: latest                   # "latest" or an Onshape version name
  origin_frame: ascope_origin       # mate connector: floor plane, frame center, +X front, +Z up

signals:                            # values robot code provides, SI units
  elevator: {units: m}
  wrist:    {units: rad}
  turret:   {units: rad}

joints:                             # only listed j_ mates become components
  # ratio is relative to the joint's PARENT link in the URDF tree.
  # Two-stage cascade, carriage mated to stage 1: both 0.5.
  j_elevator_stage1:   {signal: elevator, ratio: 0.5}
  j_elevator_carriage: {signal: elevator, ratio: 0.5}
  j_wrist:             {signal: wrist, direction: -1, zero_offset_deg: 0}
  j_turret:            {signal: turret}

mesh:
  triangle_budget: 300000
  exclude_names: ["*screw*", "*bolt*", "*nut*", "*washer*", "*rivet*"]
  min_part_size_mm: 6
  keep_detail: ["*bumper*"]         # adds NOSIMPLIFY to these mesh names

cameras:                            # mate connectors named cam_<NAME>
  frame_prefix: cam_
  photonvision_calibrations: assets/photonvision   # "<NAME> Calibration.json"
  fallback: {resolution: [1280, 800], fov_deg: 70}

frames:                             # mate connectors named frame_<name>
  frame_prefix: frame_

codegen:
  java_package: frc.robot.generated
  output: src/main/java/frc/robot/generated/RobotModel.java
  test_output: src/test/java/frc/robot/generated/RobotModelTest.java
